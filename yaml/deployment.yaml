apiVersion: apps/v1
kind: Deployment
metadata:
  name: feedback-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: feedback-app
  template:
    metadata:
      labels:
        app: feedback-app
    spec:
      containers:
      - name: feedback-app
        image: praveenfr/feedback-app:2025-1
        ports:
        - containerPort: 80

apiVersion: v1
kibnd: Service
metadata:
  name: feedback-Service
spec:
  type: LoadBalancer
  selector:
    app: feedback
  ports:
  - port: 80
    targetPort: 80